<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      table,
      th,
      tr,
      td {
        border: solid 1px #000;
        border-collapse: collapse;
        padding: 5px;
      }

      caption {
        font-weight: bold;
        padding: 5px;
        background-color: aquamarine;
      }

      .cabecalho {
        background-color: aqua;
      }
    </style>
  </head>
  <body>
    <table>
      <caption>
        Trajetória Acadêmica e Profissional
      </caption>
      <tr class="cabecalho">
        <th rowspan="2">Estudante</th>
        <th colspan="2">Formação</th>
        <th rowspan="2">Ano de conclusão</th>
      </tr>
      <tr class="cabecalho">
        <td>Graduação</td>
        <td>Pós-Graduação</td>
      </tr>
      <tr>
        <th>José</th>
        <td>Ciência da Computação</td>
        <td>Inteligência Artificial</td>
        <td>2023</td>
      </tr>
      <tr>
        <th>Ana</th>
        <td>Engenharia de Software</td>
        <td>Gestão de projetos</td>
        <td>2022</td>
      </tr>
    </table>
  </body>
</html>
